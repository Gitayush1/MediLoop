version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mediloop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediloop
      POSTGRES_PASSWORD: mediloop_password
      POSTGRES_DB: mediloop_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mediloop -d mediloop_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mediloop_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass mediloop_redis_password
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'mediloop_redis_password', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: mediloop_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://mediloop:mediloop_password@postgres:5432/mediloop_dev
      REDIS_URL: redis://:mediloop_redis_password@redis:6379
    ports:
      - '3000:3000'
    volumes:
      - ./apps/server:/app
      - /app/node_modules
      - server_uploads:/app/uploads
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  server_uploads:

networks:
  default:
    name: mediloop_network
